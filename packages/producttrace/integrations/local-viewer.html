<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>producttrace</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --rail: #2563eb; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --rail: #60a5fa; --card: #292524; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  select { font: inherit; font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; }
  .goal { border-left: 3px solid var(--rail); background: var(--card); border-radius: 0 8px 8px 0; margin: 0 0 10px; padding: 10px 14px; box-shadow: 0 1px 0 var(--line); }
  .goal summary { cursor: pointer; list-style: none; }
  .goal summary::-webkit-details-marker { display: none; }
  .goal .when { color: var(--muted); font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .steps { margin: 8px 0 2px 4px; padding-left: 14px; border-left: 1px dashed var(--line); }
  .steps li { margin: 4px 0; font-size: 14px; }
  .facts { color: var(--muted); font-size: 12px; margin: 2px 0 0; padding-left: 16px; list-style: disc; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>What the user is doing</h1>
    <span class="muted" id="state">connecting…</span>
    <select id="session" hidden></select>
  </header>
  <ol id="goals"></ol>
  <p class="empty" id="empty" hidden>Use the app in another tab. Each thing you do shows up here as a sentence.</p>
</main>
<script>
const base = location.pathname.replace(/\/?$/, '');
const goals = document.getElementById('goals');
const picker = document.getElementById('session');
const state = document.getElementById('state');
const empty = document.getElementById('empty');
const open = new Set();
let chosen = null;
let last = '';

picker.addEventListener('change', () => { chosen = picker.value; last = ''; tick(); });
goals.addEventListener('toggle', (event) => {
  const id = event.target.dataset?.id;
  if (id) event.target.open ? open.add(id) : open.delete(id);
}, true);

const el = (tag, props = {}, ...children) => { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; };
const time = (at) => (at ? new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');

function render(story) {
  const sessions = story.sessions || [];
  const latest = sessions.at(-1)?.session ?? null;
  if (!chosen || !sessions.some((entry) => entry.session === chosen)) chosen = latest;
  picker.hidden = sessions.length < 2;
  picker.replaceChildren(...sessions.map((entry, index) => el('option', { value: entry.session, selected: entry.session === chosen, textContent: `Session ${index + 1} · ${time(entry.started_at)} · ${entry.actions} actions` })));
  const lines = new Map((story.lines || []).map((line) => [line.id, line]));
  const segments = (story.segments || []).filter((segment) => segment.session === chosen);
  empty.hidden = segments.length > 0;
  goals.replaceChildren(...segments.map((segment) => {
    const first = lines.get(segment.lines?.[0]);
    const steps = el('ol', { className: 'steps' }, ...segment.steps.map((step) => el('li', {}, step.text,
      ...(step.facts?.length ? [el('ul', { className: 'facts' }, ...step.facts.map((fact) => el('li', { textContent: typeof fact === 'string' ? fact : fact.text ?? JSON.stringify(fact) })))] : []))));
    const details = el('details', { open: open.has(segment.id) }, el('summary', {}, el('span', { className: 'when', textContent: time(first?.at) }), segment.title), steps);
    details.dataset.id = segment.id;
    return el('li', { className: 'goal' }, details);
  }));
}

async function tick() {
  try {
    const response = await fetch(`${base}/story`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${response.status}`);
    const text = await response.text();
    state.textContent = 'live';
    if (text !== last) { last = text; render(JSON.parse(text)); }
  } catch (error) {
    state.textContent = `waiting for the collector (${error.message})`;
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
